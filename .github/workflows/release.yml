name: Release
# Runs when a version tag (v1.2.3) is pushed – normally through `npm run release -- patch`.
# Builds the Windows NSIS installer and publishes it together with latest.yml (used by the in-app auto-updater)
# to a GitHub Release. No secrets are needed except the automatic GITHUB_TOKEN.
on:
  push:
    tags: ["v*.*.*"]
  # Manual run from the Actions tab: builds the version currently in package.json and creates its tag if needed.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Version / tag check
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v$v" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1; fi
          echo "Releasing version $v"

      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build

      # manual run: the tag is created only AFTER typecheck, tests and build succeeded
      - name: Create tag for a manual run
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null 2>&1; then echo "tag v$v already exists"; else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$v" -m "Komenský $v"
            git push origin "v$v"
          fi

      - name: Build installer and publish GitHub Release
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ---- OPTIONAL CODE SIGNING (later): add these repository secrets and the build signs automatically ----
          # CSC_LINK: ${{ secrets.CSC_LINK }}                # base64 of the .pfx certificate
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Azure Trusted Signing alternative (also uncomment azureSignOptions in electron-builder.yml):
          # AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          # AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          # AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
